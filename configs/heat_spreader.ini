# FiniteCore - heat spreader with two chips
#
# A 20 cm x 10 cm x 3 mm aluminium plate (2D plate model: heat flows in-plane).
#   * a copper insert under the "CPU" die spreads its heat
#   * the CPU dissipates a steady 40 W
#   * the "GPU" dissipates 25 W in on/off bursts (80 s period)
#   * the left edge is clamped to a 25 degC cold plate
#   * the other edges and both faces lose heat to 25 degC air (natural convection)
#
# Shows: [constants], material regions, total-power sources with a
# time-dependent expression, Dirichlet + Robin edges, face convection, probes.

title = Heat spreader: steady CPU + pulsing GPU

[constants]
T_amb = 25            # degC
h_air = 10            # W/(m^2 K), natural convection

[mesh]
width     = 0.2
height    = 0.1
nx        = 160
ny        = 80
thickness = 0.003     # m

[material]            # aluminium 6061
conductivity  = 167
density       = 2700
specific_heat = 896

[material.copper_insert]
circle        = 0.06, 0.05, 0.025     # cx, cy, r
conductivity  = 390
density       = 8960
specific_heat = 385

[source.cpu]
rect  = 0.045, 0.035, 0.075, 0.065    # x0, y0, x1, y1  (3 cm x 3 cm die)
power = 40                            # W, spread uniformly over the die

[source.gpu]
rect  = 0.13, 0.03, 0.17, 0.07
power = 25 * (sin(2*pi*t/80) > 0)     # 25 W for 40 s, off for 40 s, ...

[boundary.cold_plate]
side        = left
type        = dirichlet
temperature = T_amb

[boundary.air]
side    = right, top, bottom
type    = robin
h       = h_air
ambient = T_amb

[faces]               # both large faces of the plate
h       = h_air
ambient = T_amb

[initial]
temperature = T_amb

[time]
end    = 400
dt     = 0.5
scheme = backward_euler

[view]
range    = 25, 80
colormap = inferno
contours = 15
playback = 16

[output]
interval = 4             # s of simulated time between saved frames
gif      = true
gif_fps  = 15
csv      = true

[probes]
cpu        = 0.06, 0.05
gpu        = 0.15, 0.05
right_edge = 0.199, 0.05
