# FiniteCore - baking a banana
#
# A banana straight from the fridge (6 degC) goes into a 180 degC fan oven for
# 20 minutes. Heat enters through the skin (convection plus radiation, lumped
# into one heat transfer coefficient) and soaks inwards: the thin stalk and tip
# warm up within minutes while the core of the fat middle lags far behind.
#
# The shape is a `tube` mesh: a solid swept along a circular arc, with a radius
# profile radius(s) (s = 0 at the stalk, 1 at the tip) and a cross-section
# shape section(angle). Moisture loss and the peel are not modelled.
#
# Window: drag to rotate, scroll to zoom, v cycles the cut modes, x/y/z pick
# the cut axis, arrow keys move the cut.

title = Baking a banana (180 degC oven)

[constants]
R0     = 0.018        # m, radius at the fattest point
T_oven = 180          # degC

[mesh]
type    = tube
length  = 0.20        # m, measured along the curved centre line
bend    = 0.14        # m, radius of the centre-line arc (the banana's curve)
# Thin stalk for the first 8 %, then a fat body tapering to a blunt tip.
radius  = R0 * if(s < 0.08, 0.3, 0.3 + 0.7 * max(sin(pi * (s - 0.08) / 0.92), 0)^0.6)
section = 1 + 0.05 * cos(5 * angle)   # five shallow ridges around the skin
cells   = 96, 12      # along the banana, across it

[material]            # banana flesh: ~75 % water
conductivity  = 0.48  # W/(m K)
density       = 980   # kg/m^3
specific_heat = 3350  # J/(kg K)

[initial]
temperature = 6       # out of the fridge

[boundary.oven]
side    = all         # start (stalk end), end (tip) and surface
type    = robin
h       = 25          # W/(m^2 K), fan-forced air + radiation, linearised
ambient = T_oven

[time]
end    = 1200         # s (20 minutes)
dt     = 2
scheme = backward_euler

[view]
range    = 0, 180
colormap = turbo
contours = 9
mode     = clip       # cut lengthwise through the middle (y = 0)
axis     = y
cut      = 0, 0, 0
yaw      = -70
pitch    = 22
zoom     = 1.15
spin     = 2          # slow turn: 30 degrees over the 15 s playback
playback = 15

[output]
interval = 10         # one frame per 10 s of baking
gif      = true
csv      = true

[probes]              # on the curved centre line, plus one just under the skin
core       = 0, 0, 0                 # middle of the fattest section
under_skin = 0, 0, -0.015            # 2 mm under the bottom of the skin
tip_core   = 0.0757, 0, 0.0222       # 90 % of the way to the tip
stalk      = -0.0855, 0, 0.0291      # middle of the stalk
