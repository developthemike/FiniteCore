# FiniteCore - roasting a turkey
#
# A thawed, unstuffed ~20 lb turkey goes from the fridge (40 degF) into a
# conventional oven at 325 degF for 4.5 hours, breast side up on a rack. USDA
# guidance for an unstuffed 18-20 lb bird at 325 degF is 4 1/4 to 4 1/2 hours,
# done when the thickest part of the breast and the innermost thigh read
# 165 degF. That isotherm is drawn as a contour line.
#
# The bird is a hollow `tube` mesh: the body (breast on top, a thin back
# underneath, thighs bulging from the lower sides of the rear half) around the
# empty body cavity, which is open at the neck and at the tail. Hot oven air
# reaches the cavity only through those openings, so it heats the inside walls
# far more weakly than the oven heats the skin. The lower third of the bird
# sits below the rim of the roasting pan, which shields it from the oven walls.
#
# Result: the middle of the breast reaches 165 degF after 4.0 h and the coldest
# spot in the bird (deep in the breast, next to the cavity) after 4.3 h. At
# 4.5 h the breast reads ~178 degF and the inner thigh ~186 degF.
#
# Not modelled: drumsticks and wings (thin, they finish well before the
# breast), bones, browning, the rest after roasting (carry-over cooking), and
# moisture loss except as part of the effective heat transfer coefficients.
#
# Temperatures are in degF. That is fine here: with no heat sources the heat
# equation and its convective boundaries are linear in T, so any linear
# temperature scale gives the same result; k and h keep their SI values.
#
# Window: drag to rotate, scroll to zoom, v cycles the cut modes, x/y/z pick
# the cut axis, arrow keys move the cut.

title = Roasting a turkey (325 degF, unstuffed)

[constants]
L_body = 0.34         # m, neck opening to tail
R_side = 0.115        # m, centre line to the side of the body at mid-length
z_rim  = -0.03        # m, rim of the roasting pan (the back of the bird is at z = -0.076)
T_oven = 325          # degF
T_fridge = 40         # degF, thawed in the fridge

[mesh]
type    = tube
length  = L_body
# Blunt at both ends (neck and tail), fullest in the middle.
radius  = R_side * (0.5 + 0.5 * max(sin(pi * s), 0)^0.7)
# angle 0 = up (+z), +-pi = down, -pi/2 = +y. A deep breast on top and a flat
# back below (12.4 / 11.6 / 7.6 cm from the centre line to the top / side /
# bottom at mid-length), plus the two thighs on the lower sides of the rear half.
section = 1 + 0.21 * cos(angle) - 0.125 * cos(angle)^2 + 0.24 * exp(-((abs(angle) - 2.0) / 0.42)^2) * exp(-((s - 0.66) / 0.15)^2)
# The empty body cavity: 11 cm across in the middle, 5 cm openings at the ends.
cavity  = 0.025 + 0.03 * max(sin(pi * s), 0)^0.8
cells   = 64, 20      # 64 along x 10 through the wall x 80 around

[material]            # turkey meat (raw, ~74 % water)
conductivity  = 0.48  # W/(m K)
density       = 1050  # kg/m^3
specific_heat = 3500  # J/(kg K)

[initial]
temperature = T_fridge

[boundary.oven]
side    = surface, start, end   # the skin and the meat around the two openings
type    = robin
# Convection plus radiation from the oven walls would be ~15 W/(m^2 K), but a
# roasting bird also loses about a kilogram of water, and evaporating it takes
# about as much heat as warming the meat. The effective h (and the cavity's)
# below were chosen so that the timing matches the USDA chart; with them the
# meat just under the skin stays below boiling, as a moist surface does.
h       = 8           # W/(m^2 K), effective
ambient = T_oven

[boundary.in_pan]     # later sections win: the skin below the pan's rim
side    = surface, start, end
where   = z < z_rim   # facet centroid
type    = robin
h       = 4           # W/(m^2 K), effective: the pan blocks the oven walls' radiation
ambient = T_oven

[boundary.cavity]
side    = cavity      # inside the empty bird: no direct radiation, sluggish air
type    = robin
h       = 3           # W/(m^2 K), effective
ambient = T_oven

[time]
end    = 16200        # s (4.5 hours)
dt     = 10
scheme = backward_euler

[view]
range    = 45, 325    # degF; with 7 contours the isotherms fall at 85, 125, 165 (done), 205, 245 and 285
unit     = °F
colormap = turbo
contours = 7
mode     = octant     # cut away the top front quarter: the breast across and along
cut      = -0.017, 0, 0   # through the breast probes; neck on the left, tail and thighs on the right
yaw      = -125
pitch    = 25
playback = 18

[output]
interval = 90         # one frame per 1.5 minutes of roasting
gif      = true
csv      = true

[probes]              # mid-length is x = 0; neck at x = -0.17, tail at x = +0.17
breast_center = -0.017, 0, 0.0895    # thickest part of the breast, 3.5 cm deep (mid-depth)
breast_deep   = -0.017, 0, 0.0721    # same spot 5 cm deep, closer to the cavity (the cold side)
thigh_inner   = 0.0544, 0.067, -0.0307   # innermost thigh, 5 cm deep, towards the joint
back          = 0, 0, -0.0657        # middle of the thin meat on the back
under_skin    = -0.017, 0, 0.1142    # 1 cm under the skin on top of the breast
