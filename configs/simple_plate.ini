# FiniteCore - the simple starting case
#
# A 10 cm x 10 cm aluminium plate starts at 20 degC. At t = 0 its top edge is
# suddenly held at 100 degC while the other three edges stay at 20 degC.
# Heat diffuses in from the top until the classic steady-state "hot lid"
# profile is reached (thermal diffusion time L^2/alpha ~ 100 s).
#
# Run:  ./build/finitecore configs/simple_plate.ini
#       ./build/finitecore configs/simple_plate.ini --headless      (files only)
#       ./build/finitecore configs/simple_plate.ini --set mesh.nx=128 --set time.dt=0.02

title = Square plate, top edge heated

[mesh]
width  = 0.1          # m
height = 0.1          # m
nx     = 64           # cells along x (each cell = 2 linear triangles)
ny     = 64

[material]            # aluminium
conductivity  = 237   # W/(m K)
density       = 2700  # kg/m^3
specific_heat = 900   # J/(kg K)

[initial]
temperature = 20      # degC; may be an expression in x and y

[boundary.top]
type        = dirichlet
temperature = 100

[boundary.cold]
side        = left, right, bottom
type        = dirichlet
temperature = 20

[time]
end    = 60           # s
dt     = 0.05         # s
scheme = backward_euler   # explicit | backward_euler | crank_nicolson | theta

[solver]
tolerance      = 1e-6  # relative CG residual per step
max_iterations = 500

[view]
window   = true
height   = 800
playback = 12         # wall-clock seconds for the whole run
range    = 20, 100
colormap = inferno    # inferno | viridis | turbo | gray
contours = 8

[output]
interval = 0.5        # s of simulated time between saved frames
gif      = true
csv      = true
png      = false
vtk      = false

[probes]              # temperature histories written to timeseries.csv
center      = 0.05, 0.05
near_top    = 0.05, 0.09
quarter     = 0.025, 0.075
