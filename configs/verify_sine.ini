# FiniteCore - verification against an exact solution
#
# Square plate with all edges held at 0 and the initial field
#     T(x, y, 0) = A sin(pi x / L) sin(pi y / L)
# This mode decays exactly as
#     T(x, y, t) = A exp(-2 alpha pi^2 t / L^2) sin(pi x / L) sin(pi y / L)
# so the solver error can be measured directly. Halving the mesh size should
# cut the error by ~4x (second-order P1 elements, Crank-Nicolson in time):
#
#   for n in 16 32 64 128; do
#     ./build/finitecore configs/verify_sine.ini --headless --no-output --set mesh.nx=$n
#   done

title = Verification: decaying sine mode

[constants]
L     = 0.1
A     = 100
k     = 50
rho   = 7800
cp    = 500
alpha = k / (rho * cp)

[mesh]
width  = L
height = L
nx     = 64

[material]
conductivity  = k
density       = rho
specific_heat = cp

[initial]
temperature = A * sin(pi * x / L) * sin(pi * y / L)

[boundary.edges]
side        = all
type        = dirichlet
temperature = 0

[time]
end    = 60
dt     = 0.05
scheme = crank_nicolson

[solver]
tolerance = 1e-7

[verify]
exact = A * exp(-2 * alpha * pi^2 * t / L^2) * sin(pi * x / L) * sin(pi * y / L)

[view]
range    = 0, A
colormap = viridis
contours = 10

[output]
interval = 1
gif      = false
csv      = true
