# FiniteCore - 3D verification against an exact solution
#
# Cube with all faces held at 0 and the initial field
#     T(x, y, z, 0) = A sin(pi x / L) sin(pi y / L) sin(pi z / L)
# which decays exactly as
#     T(x, y, z, t) = A exp(-3 alpha pi^2 t / L^2) sin(pi x / L) sin(pi y / L) sin(pi z / L)
# Halving the mesh size should cut the error by ~4x (linear tetrahedra):
#
#   for n in 8 16 32 64; do
#     ./build/finitecore configs/verify_sine_3d.ini --headless --no-output --set mesh.nx=$n
#   done

title = 3D verification: decaying sine mode

[constants]
L     = 0.1
A     = 100
k     = 50
rho   = 7800
cp    = 500
alpha = k / (rho * cp)

[mesh]
size = L, L, L
nx   = 32           # ny and nz follow (cubic cells)

[material]
conductivity  = k
density       = rho
specific_heat = cp

[initial]
temperature = A * sin(pi * x / L) * sin(pi * y / L) * sin(pi * z / L)

[boundary.faces]
side        = all
type        = dirichlet
temperature = 0

[time]
end    = 60
dt     = 0.05
scheme = crank_nicolson

[solver]
tolerance = 1e-7

[verify]
exact = A * exp(-3 * alpha * pi^2 * t / L^2) * sin(pi * x / L) * sin(pi * y / L) * sin(pi * z / L)

[view]
range    = 0, A
colormap = viridis
contours = 10
mode     = octant

[output]
interval = 1
gif      = false
csv      = true
