# FiniteCore - 3D heat sink base with a pulsing chip
#
# An 8 x 8 x 2 cm aluminium block with a copper core under the chip.
#   * a 2 x 2 cm chip on the bottom face dissipates 150 W in 15 s bursts
#   * liquid cold plate on the top face, natural convection on the sides
#   * the bottom face is insulated apart from the chip
#
# Shows 3D regions (box, cylinder via circle), time-dependent sources and
# convection on chosen faces. Try `v` in the window to cycle the cut modes.

title = Heat sink base: pulsing 150 W chip

[constants]
T_amb = 25

[mesh]
size  = 0.08, 0.08, 0.02
cells = 48, 48, 12

[material]                      # aluminium
conductivity  = 205
density       = 2700
specific_heat = 900

[material.copper_core]          # circle in x-y = cylinder through the full height
circle        = 0.04, 0.04, 0.016
conductivity  = 390
density       = 8960
specific_heat = 385

[source.chip]
box   = 0.03, 0.03, 0.0, 0.05, 0.05, 0.002
power = 150 * (mod(t, 30) < 15) # W: on for 15 s, off for 15 s

[boundary.cold_plate]
side    = top
type    = robin
h       = 1000                  # W/(m^2 K), liquid cold plate
ambient = T_amb

[boundary.sides]
side    = left, right, front, back
type    = robin
h       = 10
ambient = T_amb

[initial]
temperature = T_amb

[time]
end    = 120
dt     = 0.1
scheme = backward_euler

[view]
range    = 25, 48
colormap = turbo
contours = 14
mode     = clip
axis     = y
yaw      = -60
pitch    = 20
playback = 15

[output]
interval = 1
gif      = true
csv      = true

[probes]
chip     = 0.04, 0.04, 0.001
top_mid  = 0.04, 0.04, 0.02
corner   = 0.0, 0.0, 0.02
