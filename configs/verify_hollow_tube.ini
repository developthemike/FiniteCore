# FiniteCore - verification of the hollow `tube` mesh (cavity)
#
# A thick-walled pipe, 0.2 m long, bore radius 2 cm, outer radius 5 cm. The
# bore (side `cavity`) is held at 100 degC, the outer skin at 0 degC, and the
# two ends are insulated. The exact steady temperature is radial conduction
# through a cylinder wall:
#     T = 100 (1 - ln(r / ri) / ln(ro / ri))
# which [verify] compares against at every node. The probes sit at different
# angles, one of them on the seam where the ring of cells is closed (straight
# down, -z). Refining the mesh in every direction quarters the error:
#
#   for c in 20,6 40,12 80,24 160,48; do
#     ./build/finitecore configs/verify_hollow_tube.ini --headless --set mesh.cells=$c
#   done

title = Hollow pipe, steady radial conduction (cavity mesh check)

[constants]
ri = 0.02             # m, bore radius
ro = 0.05             # m, outer radius

[mesh]
type   = tube
length = 0.2
radius = ro
cavity = ri
cells  = 40, 12       # 40 along x 6 through the wall x 48 around

[material]
conductivity  = 50
density       = 1000
specific_heat = 1000

[initial]
temperature = 0

[boundary.bore]
side        = cavity
type        = dirichlet
temperature = 100

[boundary.skin]
side        = surface
type        = dirichlet
temperature = 0

[time]                # long enough to reach the steady state (wall^2/alpha = 18 s)
end = 2000
dt  = 50

[verify]
exact = 100 * (1 - log(sqrt(y^2 + z^2) / ri) / log(ro / ri))

[view]
range = 0, 100
mode  = clip
axis  = x
cut   = 0, 0, 0

[output]
interval = 2000
gif      = false

[probes]              # exact: 55.75, 38.93 and 24.35 degC
r30_top  = 0,     0,     0.03
r35_seam = 0.05,  0,    -0.035
r40_side = 0,    -0.04,  0
