# FiniteCore - verification of the curved `tube` mesh
#
# A bent rod of constant radius (centre-line arc of radius 0.1 m, 0.2 m long,
# i.e. 2 rad of arc) with its ends held at 100 and 0 degC and an insulated
# skin. The exact steady temperature depends only on the angle along the arc:
#     T = 100 (1 - s)          s = fraction of the length
# so every probe a quarter of the way along must read 75 degC - on the centre
# line, on the inside and outside of the bend, and on the side - and the middle
# 50 degC. Refining the mesh drives all of them to the exact values:
#
#   for c in 32,6 64,12 128,24; do
#     ./build/finitecore configs/verify_tube.ini --headless --set mesh.cells=$c
#     tail -1 output/verify_tube/timeseries.csv
#   done

title = Bent rod, steady conduction (tube mesh check)

[mesh]
type   = tube
length = 0.2
bend   = 0.1
radius = 0.02
cells  = 64, 12

[material]
conductivity  = 50
density       = 1000
specific_heat = 1000

[initial]
temperature = 50

[boundary.hot]
side        = start
type        = dirichlet
temperature = 100

[boundary.cold]
side        = end
type        = dirichlet
temperature = 0

[time]                # long enough to reach the steady state (L^2/alpha = 800 s)
end = 20000
dt  = 200

[view]
range = 0, 100
mode  = clip
axis  = y
cut   = 0, 0, 0

[output]
interval = 20000
gif      = false

[probes]              # quarter length: centre line at (-0.047943, 0, 0.012242)
center = -0.047943,  0,     0.012242
inner  = -0.040273,  0,     0.026284   # 16 mm towards the centre of the bend
outer  = -0.055613,  0,    -0.001800   # 16 mm away from it
side   = -0.047943, -0.016, 0.012242
middle =  0,         0,     0
