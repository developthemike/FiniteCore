# FiniteCore - the simple 3D case
#
# The 3D version of simple_plate.ini: a 10 cm aluminium cube starts at 20 degC.
# At t = 0 its top face is held at 100 degC while the other five faces stay at
# 20 degC. Heat soaks in from the top; by superposition of the six one-hot-face
# problems the steady centre temperature is 20 + 80/6 = 33.33 degC.
#
# The view cuts away the octant facing the camera to show the inside.
# Window: drag to rotate, scroll to zoom, v cycles surface/clip/octant/slices,
# x/y/z pick the cut axis, arrow keys move the cut.

title = Cube, top face heated

[mesh]
size  = 0.1, 0.1, 0.1     # m (x, y, z); z is up
cells = 40, 40, 40        # each cube cell = 6 linear tetrahedra

[material]                # aluminium
conductivity  = 237
density       = 2700
specific_heat = 900

[initial]
temperature = 20

[boundary.top]
type        = dirichlet
temperature = 100

[boundary.cold]
side        = bottom, left, right, front, back
type        = dirichlet
temperature = 20

[time]
end    = 60
dt     = 0.05
scheme = backward_euler

[view]
range    = 20, 100
colormap = turbo
contours = 8
mode     = octant         # surface | clip | octant | slices
yaw      = -55            # camera azimuth (degrees)
pitch    = 28             # camera elevation (degrees)
spin     = 6              # degrees of camera turn per second of playback (0 = still)

[output]
interval = 0.5
gif      = true
csv      = true

[probes]
center   = 0.05, 0.05, 0.05
near_top = 0.05, 0.05, 0.09
